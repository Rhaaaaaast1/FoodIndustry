# ============================================================================
#  Gradle
# ============================================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存（configuration-cache）先关掉：ModDevGradle 2.0.148 + 首次下载工件时，
# 它曾因 :createMinecraftArtifacts 的 FileCollection 字段无法序列化而报错。
# 等构建稳定后想提速，可把它改回 true。
org.gradle.configuration-cache=false

# 让 Gradle 直接使用本机 JDK 21（NeoForge 1.21.1 需要 Java 21）。
# 不写这一行的话：PATH 上排第一的是 JDK 25，且 foojay 可能尝试联网下载 JDK。
org.gradle.java.installations.paths=E:/jdk/jdk21

# ============================================================================
#  Minecraft / NeoForge
# ============================================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.256
neo_version_range=[21.1,)
loader_version_range=[4,)

# Parchment 映射（给 Minecraft 参数起可读名字）。
# 注意：这两个值必须与 MC 小版本对应。原工程里写的是 1.21.11 / 2025.12.20
# （那是新版 MC 的），配 1.21.1 会解析失败。
parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28

# ============================================================================
#  模组信息
# ============================================================================
mod_id=foodindustry
mod_name=FoodIndustry
mod_license=MIT
mod_version=0.1.0
mod_group_id=dev.rhaaaaaast1
mod_authors=rhaaaaaast1, deepseek
mod_description=以 Farmer's Delight 为前置的农业与烹饪扩展：作物 / 果树 / 流体 / 食物 / 蒸制。

# ============================================================================
#  依赖版本
# ============================================================================
# Farmer's Delight：硬前置。jar 放在 libs/ 下，走本地文件依赖（离线可用）。
# ⚠️ gradle.properties **不支持嵌套占位符**：写成
#     farmersdelight_jar=FarmersDelight-${farmersdelight_version}.jar
#   不会被展开，会把字面量 ${farmersdelight_version} 当成文件名（曾因此让 dev 运行报
#   "farmersdelight is not installed"）。所以这里直接写全名。
farmersdelight_version=1.21.1-1.3.4
farmersdelight_jar=FarmersDelight-1.21.1-1.3.4.jar

# JEI：软兼容。编译期只要 api，运行期用完整版（由玩家自行安装，不打包进我们的 jar）。
# 版本与本机 mods 目录里装的 jei-1.21.1-neoforge-19.57.0.449.jar 保持一致。
jei_version=19.57.0.449

# Jade：软兼容。⚠️ Jade 没有公共 Maven，只能用 CurseMaven 或本地 jar。
# 需要时把 Jade 的 jar 放进 libs/，并解除 build.gradle 里对应两行的注释。
# jade_jar=Jade-1.21.1-NeoForge-15.10.6.jar

# AppleSkin（中文常叫"苹果皮"）：**开发期辅助模组，不是依赖**。
# 它给物品提示和 HUD 显示饥饿值/饱和度数值，用来肉眼核对食物的食物数值。
# 两端都是 optional（客户端装了就够显示，装在服务端才能显示精确的饱和度/消耗值），
# 所以只进 devMods —— 不进 compileOnly，也不会随模组分发。
# 来源：Modrinth https://modrinth.com/mod/appleskin （Unlicense）
appleskin_version=3.0.9+mc1.21
